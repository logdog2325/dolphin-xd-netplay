name: Build XD Netplay

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Also build the Windows desktop client"
        type: boolean
        default: false
      build_macos:
        description: "Also build the macOS (arm64) desktop client"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # dolphin-emu/dolphin master as of 2026-07-23 (includes Android netplay, PR 14647)
  BASE_SHA: d6e803e63d7a809fcafb4e39c79bdf4aabb49c79
  # PR 14745 "Android: add dual-screen Wii pointer and GBA support" head
  PR_SHA: 6ea62d8b29ba22e0e2cdc88b4359334a875b6224

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.mk.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - name: Construct xd-netplay branch
        id: mk
        run: |
          set -eux
          git clone --single-branch --branch master https://github.com/dolphin-emu/dolphin.git dolphin
          cd dolphin
          git config user.name "logdog2325"
          git config user.email "loganjayfisher@gmail.com"
          git fetch origin refs/pull/14745/head:pr-14745
          git checkout -b xd-netplay "$BASE_SHA"
          if git cat-file -e "$PR_SHA^{commit}" 2>/dev/null; then
            MERGE_REF="$PR_SHA"
          else
            MERGE_REF="pr-14745"
            echo "::warning::Pinned PR 14745 SHA is gone (force push upstream); using current head"
          fi
          git merge --no-edit "$MERGE_REF"
          git am ../ci/patches/*.patch
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          git remote add mine "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f mine xd-netplay
          if [ -n "$TAG" ]; then git push -f mine "refs/tags/$TAG"; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.15729638" > /dev/null
      - name: Pre-copy Sys assets
        run: |
          mkdir -p Source/Android/app/src/main/assets
          rm -rf Source/Android/app/src/main/assets/Sys
          cp -r Data/Sys Source/Android/app/src/main/assets/Sys
          rm -rf Source/Android/app/src/main/assets/Sys/Themes
      # Every APK users install must carry the SAME signature, or Android refuses to install the
      # new build over the old app and they have to uninstall -- which deletes their team saves.
      # Without this the runner's throwaway debug keystore signs each build with a different key.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set; refusing to ship an unsignable APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          # Fail here, in seconds, rather than after the native build: an unreadable keystore is
          # otherwise only discovered at the packaging step at the very end of the job.
          keytool -list -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" > /dev/null
          echo "keystore=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"
      - name: Build APK
        working-directory: Source/Android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew assembleDebug --no-daemon \
            -Pkeystore="${{ steps.signing.outputs.keystore }}" \
            -Pstorepass="$KEYSTORE_PASSWORD" \
            -Pkeyalias="$KEY_ALIAS" \
            -Pkeypass="$KEYSTORE_PASSWORD" \
            -Pstoretype=PKCS12
      - name: Confirm the APK carries the expected signature
        env:
          EXPECTED_SIGNER: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          apk="$(ls Source/Android/app/build/outputs/apk/debug/*.apk | head -1)"
          # Runners carry several build-tools versions, so this must resolve to exactly one
          # apksigner -- an unquoted glob passes the others along as arguments.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          # awk over grep: no match is an empty result to report, not a pipeline failure that
          # reads like the signature itself was wrong.
          signer="$("$apksigner" verify --print-certs "$apk" \
            | awk '/SHA-256 digest/ { print $NF; exit }')"
          if [ -z "$signer" ]; then
            echo "::error::Could not read the APK's signer certificate."
            exit 1
          fi
          echo "signer SHA-256: $signer"
          if [ -n "${EXPECTED_SIGNER:-}" ] && [ "$signer" != "$EXPECTED_SIGNER" ]; then
            echo "::error::Signer changed ($signer, expected $EXPECTED_SIGNER) -- users could not"
            echo "::error::update over their existing install without uninstalling first."
            exit 1
          fi
      - name: Verify APK contents
        run: |
          set -euo pipefail
          apk="$(ls Source/Android/app/build/outputs/apk/debug/*.apk | head -1)"
          entries="$(unzip -Z1 "$apk")"
          for f in \
            lib/arm64-v8a/libmain.so \
            assets/Sys/GBA/gba_bios.bin \
            assets/Sys/GameSettings/GXXE01.ini \
            assets/xdnetplay/gen3data.json \
            assets/xdnetplay/EMERALD-2.sav \
            assets/xdnetplay/EMERALD-3.sav; do
            grep -qx "$f" <<< "$entries" || { echo "APK missing $f" >&2; exit 1; }
          done
          wrong="$(awk -F/ '/^lib\//{print $2}' <<< "$entries" | sort -u | grep -vx arm64-v8a || true)"
          if [ -n "$wrong" ]; then echo "unexpected ABI(s): $wrong" >&2; exit 1; fi
          echo "APK contents OK"
      - name: Rename APK
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          mkdir -p out
          cp Source/Android/app/build/outputs/apk/debug/*.apk "out/dolphin-xd-netplay-${SHORT_SHA}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-xd-netplay-apk
          path: out/*.apk

  windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_windows }}
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild Source/dolphin-emu.sln /m /v:m /p:Configuration=Release /p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-xd-netplay-win64
          path: Binary/x64/

  macos:
    # arm64 desktop client so a second player on an Apple Silicon Mac (same
    # architecture as the AYN Thor) can netplay the Thor build. Netplay only
    # connects between identical Dolphin revisions, so this MUST come from the
    # same prepare/reconstruct as the Android APK in the same run -- release the
    # macOS .app and the APK from one workflow_dispatch as a matched pair.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos }}
    needs: prepare
    # macos-15 (Xcode 16 / Apple clang 16). macos-14's Apple clang 15 lacks
    # C++20 parenthesized aggregate initialization (P0960), which Dolphin's
    # HookableEvent relies on -- it fails to compile ControllerInterface.cpp.
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Install deps
        # Qt6 + Ninja only. Deliberately NO ffmpeg: linking Homebrew's ffmpeg
        # would make the .app depend on dylibs the tester doesn't have (frame
        # dumping auto-disables when it's absent), same choice OrreLink made.
        run: brew install qt ninja
      - name: Configure
        # Flags mirror BuildMacOSUniversalBinary.py (proven) for a single arm64
        # build. USE_MGBA=ON keeps the integrated-GBA support XD needs;
        # ENABLE_AUTOUPDATE=OFF because this fork has no update server;
        # POSTPROCESS_BUNDLE=ON copies Qt into the .app so it is self-contained;
        # code signing stays at the default ad-hoc "-" identity.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DENABLE_AUTOUPDATE=OFF \
            -DENABLE_TESTS=OFF \
            -DUSE_MGBA=ON \
            -DUSE_SYSTEM_LIBS=OFF \
            -DUSE_SYSTEM_ICONV=ON \
            -DUSE_SYSTEM_BZIP2=ON \
            -DUSE_SYSTEM_CURL=ON \
            -DPOSTPROCESS_BUNDLE=ON \
            -DDISTRIBUTOR=xd-netplay
      - name: Build
        run: cmake --build build --target dolphin-emu
      - name: Package .app
        run: |
          # On macOS the DolphinQt target sets OUTPUT_NAME "DolphinQt", so the
          # bundle is DolphinQt.app (at build/Binaries/), not Dolphin.app.
          APP="$(find build -name 'DolphinQt.app' -type d 2>/dev/null | head -1)"
          if [ -z "$APP" ]; then APP="$(find build -name '*.app' -type d 2>/dev/null | head -1)"; fi
          if [ -z "$APP" ]; then echo "no .app produced; build/Binaries:" >&2; ls -la build/Binaries >&2 || true; exit 1; fi
          echo "Packaging $APP"
          mkdir -p out
          ditto -c -k --keepParent "$APP" "out/dolphin-xd-netplay-macos-arm64.zip"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-xd-netplay-macos
          path: out/*.zip
